<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miquel</title>
<meta name="description" content="Miquel — I build things I wish existed. Yumlist and La Virage Club. Barcelona.">
<!-- Favicon (emoji, no necesita archivo aparte) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<!-- Open Graph: así se ve bonito al compartir el enlace en redes/WhatsApp -->
<meta property="og:title" content="Miquel — I build things I wish existed">
<meta property="og:description" content="Building Yumlist & La Virage Club. Sharing the messy road as I go.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mdemike.com">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --fg:#f6f5f3;
    --dim:#9a9894;
    --dimmer:#5c5a57;
    --line:rgba(255,255,255,.1);
    --pill:rgba(255,255,255,.06);
    --pill-hover:rgba(255,255,255,.1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--fg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  .wrap{
    width:100%;
    max-width:640px;
    text-align:center;
    animation:fade .9s ease both;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* the thesis — big and centered */
  h1{
    font-size:clamp(40px,8.5vw,68px);
    font-weight:700;
    letter-spacing:-.035em;
    line-height:1.02;
    margin-bottom:34px;
  }

  /* social pills with colored icons */
  .socials{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:30px;
  }
  .socials a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--fg);
    font-size:14.5px;
    font-weight:500;
    background:var(--pill);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 15px 8px 12px;
    transition:background .16s ease;
  }
  .socials a:hover{background:var(--pill-hover)}
  .socials svg{width:17px;height:17px;flex-shrink:0}

  /* intro line */
  .intro{
    font-size:clamp(15px,4vw,17px);
    color:var(--dim);
    line-height:1.6;
    max-width:40ch;
    margin:0 auto 40px;
  }

  /* projects — inline, elegant, not boxes */
  .projects{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px 18px;
    flex-wrap:wrap;
    margin-bottom:44px;
  }
  .projects a{
    text-decoration:none;
    color:var(--fg);
    font-size:15px;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:opacity .16s ease;
  }
  .projects a:hover{opacity:.65}
  .projects a .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .projects a .yumdot{background:#e07a4c}
  .projects a .vdot{background:#c8a24b}
  .projects a .arr{color:var(--dimmer);font-size:12px}
  .projects .sep{color:var(--dimmer);font-size:13px}

  /* email */
  form{
    display:flex;
    gap:8px;
    max-width:400px;
    margin:0 auto 14px;
  }
  input[type=email]{
    flex:1;min-width:0;
    font-family:inherit;font-size:15px;color:var(--fg);
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    border-radius:11px;
    padding:13px 16px;
    text-align:center;
    transition:border-color .16s ease,background .16s ease;
  }
  input[type=email]:focus{outline:none;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07)}
  input[type=email]::placeholder{color:var(--dimmer)}
  button{
    font-family:inherit;font-size:15px;font-weight:600;
    color:var(--bg);background:var(--fg);cursor:pointer;
    border:none;border-radius:11px;padding:13px 22px;white-space:nowrap;
    transition:opacity .16s ease;
  }
  button:hover{opacity:.85}
  .msg{font-size:13.5px;color:var(--dim);min-height:1.2em;margin-bottom:44px}
  .msg.ok{color:var(--fg)}

  .foot{font-size:12.5px;color:var(--dimmer)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">
    <h1>I build things<br>I wish existed.</h1>

    <div class="socials">
      <a href="https://www.youtube.com/@mdemikee" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24"><path fill="#FF0000" d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.7-1.7C19.4 5.2 12 5.2 12 5.2s-7.4 0-8.9.4A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.7 1.7c1.5.4 8.9.4 8.9.4s7.4 0 8.9-.4a2.5 2.5 0 0 0 1.7-1.7C23 15.2 23 12 23 12z"/><path fill="#fff" d="M9.8 15.3V8.7l5.7 3.3z"/></svg>
        @mdemikee
      </a>
      <a href="https://x.com/mdemike___" target="_blank" rel="noopener" aria-label="Twitter">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M18.9 1.6h3.5l-7.6 8.7L23.7 22h-7l-5.5-7.2L4.9 22H1.4l8.1-9.3L.6 1.6h7.2l5 6.6zm-1.2 18.3h1.9L6.9 3.6H4.8z"/></svg>
        @mdemike___
      </a>
      <a href="https://www.instagram.com/mdemike__/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><defs><radialGradient id="ig" cx="30%" cy="107%" r="150%"><stop offset="0%" stop-color="#fdf497"/><stop offset="5%" stop-color="#fdf497"/><stop offset="45%" stop-color="#fd5949"/><stop offset="60%" stop-color="#d6249f"/><stop offset="90%" stop-color="#285AEB"/></radialGradient></defs><rect x="2" y="2" width="20" height="20" rx="5.5" fill="url(#ig)"/><rect x="6.4" y="6.4" width="11.2" height="11.2" rx="3.6" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.9" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="17.2" cy="6.8" r="1" fill="#fff"/></svg>
        @mdemike___
      </a>
      <a href="https://www.linkedin.com/in/miquel-771450156/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="3" fill="#0A66C2"/><path fill="#fff" d="M7.1 9.4v8.1H4.4V9.4zM5.75 5.6a1.57 1.57 0 1 1 0 3.14 1.57 1.57 0 0 1 0-3.14M9 9.4h2.6v1.1h.04c.36-.68 1.25-1.4 2.57-1.4 2.75 0 3.26 1.81 3.26 4.17v4.23h-2.72v-3.75c0-.9-.02-2.05-1.25-2.05-1.25 0-1.44.98-1.44 1.98v3.82H9z"/></svg>
        LinkedIn
      </a>
    </div>

    <p class="intro">Ex-SaaS sales turned builder in Barcelona. Sharing the messy road as I go.</p>

    <div class="projects">
      <a href="https://www.yumlist.app/" target="_blank" rel="noopener">
        <span class="dot yumdot"></span>Yumlist<span class="arr">↗</span>
      </a>
      <span class="sep">·</span>
      <a href="https://www.lavirageclub.com/" target="_blank" rel="noopener">
        <span class="dot vdot"></span>La Virage Club<span class="arr">↗</span>
      </a>
    </div>

    <form id="f" novalidate>
      <input type="email" id="email" placeholder="you@email.com" required aria-label="Email">
      <button type="submit">Subscribe</button>
    </form>
    <div class="msg" id="msg">Occasional notes on what I'm building.</div>

    <div class="foot">© 2026 Miquel · Barcelona</div>
  </main>

<script>
  var form = document.getElementById('f');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      msg.textContent = 'That email looks off — mind checking it?';
      msg.classList.remove('ok');
      return;
    }
    // TODO: connect your email provider (Buttondown, Formspree, ConvertKit…)
    form.style.display = 'none';
    msg.textContent = "You're on the list. Talk soon.";
    msg.classList.add('ok');
  });
</script>
</body>
</html>
