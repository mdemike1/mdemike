<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miquel Subias — Building Yumlist &amp; La Virage Club</title>
<meta name="description" content="Miquel Subias — I build things I wish existed. Building Yumlist and La Virage Club from Cervera, Catalonia.">
<link rel="canonical" href="https://mdemike.com/">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<!-- Favicon: "m" crema sobre cuadro oscuro -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Open Graph: así se ve al compartir el enlace en redes/WhatsApp -->
<meta property="og:title" content="Miquel Subias — I build things I wish existed">
<meta property="og:description" content="Building Yumlist &amp; La Virage Club. Sharing the messy road as I go.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mdemike.com/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    /* color */
    --bg:#0a0a0b;          /* casi negro */
    --fg:#f6f5f3;          /* texto principal — 18.6:1 sobre --bg */
    --dim:#9a9894;         /* texto secundario — 6.9:1 sobre --bg (pasa AA) */
    /* --dimmer (#5c5a57) daría 2.8:1 y no pasa AA → no se usa para texto */
    --line:rgba(255,255,255,.1);

    /* type */
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --serif:'Instrument Serif',Georgia,'Times New Roman',serif;

    /* spacing — escala de 4/8 */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    --s6:32px; --s7:40px; --s8:48px; --s9:64px; --s10:96px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    font-size:16px;
    background:var(--bg);
    color:var(--fg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:var(--s9) var(--s5);
  }
  a{color:inherit}
  a:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:4px}

  .wrap{
    width:100%;
    max-width:640px;
    margin:0 auto;
    text-align:center;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* serif italic accents — solo para palabras clave */
  em{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    letter-spacing:0;
  }

  /* ---------- logo "m" ---------- */
  .logo{
    display:grid;
    place-items:center;
    width:52px;height:52px;
    margin:0 auto var(--s7);
    border-radius:14px;
    background:var(--fg);
    color:var(--bg);
    font-family:Georgia,'Times New Roman',serif;  /* la misma que el favicon */
    font-style:italic;
    font-size:38px;
    line-height:1;
    padding-bottom:.14em;   /* centra ópticamente la "m" (no tiene ascendentes) */
    user-select:none;
  }

  /* ---------- thesis ---------- */
  h1{
    font-size:clamp(38px,8vw,64px);
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.05;
    margin-bottom:var(--s7);
    text-wrap:balance;
  }
  /* aire alrededor de la cursiva: algo más a la derecha, la serif inclinada se echa hacia ese lado */
  h1 em{font-size:1.1em;line-height:.9;margin:0 .08em 0 .04em}

  /* ---------- story: párrafo narrativo con los proyectos inline ---------- */
  .story{
    font-size:18px;
    color:var(--dim);
    line-height:1.6;
    max-width:36em;
    margin:0 auto var(--s7);
    text-wrap:pretty;
  }
  .story em{color:var(--fg);font-size:1.15em;line-height:1;white-space:nowrap;margin:0 .06em 0 .04em}
  .story a{
    color:var(--fg);
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    background-image:linear-gradient(currentColor,currentColor);
    background-size:0 1px;
    background-position:0 100%;
    background-repeat:no-repeat;
    transition:background-size .2s ease;
  }
  @media (hover:hover){.story a:hover{background-size:100% 1px}}
  /* cuadradito de color con la inicial, antes del nombre del proyecto */
  .mark{
    display:inline-block;
    width:1.05em;height:1.05em;
    margin-right:.35em;
    border-radius:.25em;
    background:var(--c);
    color:var(--mark-ink,#fff);
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:1em;
    line-height:1.05em;
    text-align:center;
    vertical-align:-.16em;  /* centrado con la altura de las mayúsculas, sin descuadrar la línea */
  }

  /* ---------- socials ---------- */
  .socials{
    list-style:none;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:var(--s2) var(--s5);
    margin-bottom:var(--s9);
  }
  .socials a{
    display:inline-flex;
    align-items:center;
    gap:var(--s2);
    padding:var(--s1) 0;
    text-decoration:none;
    color:var(--dim);
    font-size:16px;
    transition:color .16s ease;
  }
  .socials svg{width:16px;height:16px;flex-shrink:0}
  @media (hover:hover){.socials a:hover{color:var(--fg)}}

  /* ---------- footer ---------- */
  .foot{
    font-size:14px;
    color:var(--dim);
  }
  .foot span{white-space:nowrap}  /* si no cabe, corta en el "·" y no a mitad de nombre */

  @media (max-width:480px){
    body{padding:var(--s8) var(--s5)}
    .logo{margin-bottom:var(--s6)}
    h1{margin-bottom:var(--s6)}
    .story{font-size:17px;margin-bottom:var(--s7)}
    .socials{margin-bottom:var(--s8)}
  }

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">

    <div class="logo" aria-hidden="true">m</div>

    <h1>I build <em>things</em> I&nbsp;wish existed.</h1>

    <!-- Párrafo narrativo con los proyectos: el texto se edita en data.js -->
    <p class="story" id="story"></p>

    <nav aria-label="Social">
      <ul class="socials" id="socials"></ul>
    </nav>

    <footer class="foot">
      © <span id="year"></span> <span data-site="name">Miquel Subias</span> · <span data-site="location">Cervera, Catalonia</span>
    </footer>

  </main>

<!-- Contenido editable: párrafo, proyectos y redes -->
<script src="data.js"></script>
<script>
  (function(){
    var site = window.SITE || {};

    // Iconos de redes (monocromo, heredan el color del texto)
    var ICONS = {
      youtube:'<path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.7-1.7C19.4 5.2 12 5.2 12 5.2s-7.4 0-8.9.4A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.7 1.7c1.5.4 8.9.4 8.9.4s7.4 0 8.9-.4a2.5 2.5 0 0 0 1.7-1.7C23 15.2 23 12 23 12zM9.8 15.3V8.7l5.7 3.3z"/>',
      x:'<path d="M18.9 1.6h3.5l-7.6 8.7L23.7 22h-7l-5.5-7.2L4.9 22H1.4l8.1-9.3L.6 1.6h7.2l5 6.6zm-1.2 18.3h1.9L6.9 3.6H4.8z"/>',
      instagram:'<path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/>',
      linkedin:'<path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6h.1c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM7.1 20.5H3.6V9h3.5v11.5zM22.2 0H1.8C.8 0 0 .8 0 1.7v20.6c0 .9.8 1.7 1.8 1.7h20.4c1 0 1.8-.8 1.8-1.7V1.7C24 .8 23.2 0 22.2 0z"/>',
      github:'<path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>',
      tiktok:'<path d="M12.5 0h4c.2 2 1 3.6 2.4 4.6 1 .7 2.2 1.1 3.6 1.2v4a10 10 0 0 1-5.9-1.9v8.4a7.7 7.7 0 1 1-7.7-7.7c.4 0 .9 0 1.3.1v4.1a3.7 3.7 0 1 0 2.4 3.5V0z"/>',
      email:'<path d="M2 4h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v.5l10 6.2 10-6.2V6H2zm20 2.8-10 6.2-10-6.2V18h20V8.8z"/>'
    };

    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    // Texto oscuro o claro sobre el color de marca, según contraste
    function inkFor(hex){
      var h = String(hex).replace('#','');
      if(h.length === 3) h = h.replace(/./g,'$&$&');
      var rgb = [0,2,4].map(function(i){
        var v = parseInt(h.substr(i,2),16)/255;
        return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4);
      });
      var L = .2126*rgb[0] + .7152*rgb[1] + .0722*rgb[2];
      return (L + .05)/(.0103 + .05) >= (1.05)/(L + .05) ? '#1a1a18' : '#ffffff';
    }

    // Nombre y ubicación
    document.querySelectorAll('[data-site]').forEach(function(el){
      var v = site[el.getAttribute('data-site')];
      if(v) el.textContent = v;
    });

    // Enlace de proyecto inline: cuadradito con la inicial + nombre en negrita
    function projectLink(p){
      var c = p.color || '#888888';
      return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener"' +
        ' style="--c:' + esc(c) + ';--mark-ink:' + inkFor(c) + '">' +
        '<span class="mark" aria-hidden="true">' + esc((p.name || '?').charAt(0)) + '</span>' +
        esc(p.name) + '</a>';
    }

    // Párrafo narrativo: {id} → proyecto, *texto* → cursiva serif
    var projects = {};
    (site.projects || []).forEach(function(p){ projects[p.id] = p; });
    document.getElementById('story').innerHTML = esc(site.story)
      .replace(/\{([\w-]+)\}/g, function(m, id){ return projects[id] ? projectLink(projects[id]) : m; })
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // Redes
    document.getElementById('socials').innerHTML = (site.socials || []).map(function(s){
      var icon = ICONS[s.icon] ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + ICONS[s.icon] + '</svg>' : '';
      var ext = /^https?:/.test(s.url || '') ? ' target="_blank" rel="noopener"' : '';
      return '<li><a href="' + esc(s.url) + '"' + ext + '>' + icon + esc(s.label) + '</a></li>';
    }).join('');

    // Año automático
    document.getElementById('year').textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
